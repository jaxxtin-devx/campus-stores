<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Stores PRO • Media Equipment Desk</title>
    <meta name="theme-color" content="#090a0d" />
    <meta
      name="description"
      content="Premium media equipment desk operations and checkout system powered by Motion.dev."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <main>
      <div id="campus-stores-app">
        <!-- Initial skeleton state before React hydration -->
        <div class="desk-shell" style="min-height: 480px; display: flex; align-items: center; justify-content: center;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--text-muted);">
            <div style="width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--border-medium); border-top-color: var(--primary); animation: spin 1s linear infinite;"></div>
            <span style="font-size: 13px; font-weight: 500;">Loading Campus Stores Workstation...</span>
          </div>
        </div>
      </div>
    </main>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
